name: Integration-Testing CI
on: [ push, pull_request ]

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}
    name: PHP ${{ matrix.php }} and Symfony ${{ matrix.symfony }} (${{ matrix.dependencies }} dependencies)
    strategy:
      # one failing combination must not cancel the others
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-latest ]
        php: [ 8.2, 8.3, 8.4, 8.5]
        symfony: [ '6.4.*', '7.0.*', '7.1.*', '7.2.*', '7.3.*', '7.4.*', '8.0.*']
        dependencies: [ highest ]
        include:
          - operating-system: ubuntu-latest
            php: 8.2
            symfony: '6.4.*'
            dependencies: lowest
        exclude:
          - php: 8.3
            symfony: '8.0.*'
          - php: 8.2
            symfony: '8.0.*'

    steps:
      - uses: actions/checkout@master

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: flex
          extensions: opcache,zip,intl,pcntl,sockets,protobuf,grpc
          coverage: none

      - name: Download dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
          SKIP_TOOLS_INSTALL: 1
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          custom-cache-key: symfony-${{ matrix.symfony }}-php-${{ matrix.php }}-${{ matrix.dependencies }}

      - name: Run test suite on PHP ${{ matrix.php }} and Symfony ${{ matrix.symfony }}
        id: tests
        run: ./vendor/bin/phpunit --exclude-testsuite='Temporal E2E'

      - name: Diagnose PHP 8.5 process crash
        if: failure() && steps.tests.outcome == 'failure' && matrix.php == '8.5'
        run: |
          php --version
          php --ri grpc
          php --ri protobuf
          sudo apt-get update
          sudo apt-get install -y gdb
          gdb --batch -ex 'set pagination off' -ex run -ex 'thread apply all bt' --args php ./vendor/bin/phpunit --exclude-testsuite='Temporal E2E' --debug
