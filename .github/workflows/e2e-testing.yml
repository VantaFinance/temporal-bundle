name: E2E-Testing CI
on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} and Symfony ${{ matrix.symfony }} and RoadRunner ${{ matrix.rr }}
    strategy:
      matrix:
        include:
          - php: 8.2
            symfony: '6.4.*'
            rr: '2024.*'

          - php: 8.2
            symfony: '6.4.*'
            rr: '2025.*'

          - php: 8.3
            symfony: '6.4.*'
            rr: '2024.*'

          - php: 8.3
            symfony: '6.4.*'
            rr: '2025.*'

          - php: 8.4
            symfony: '6.4.*'
            rr: '2024.*'

          - php: 8.4
            symfony: '6.4.*'
            rr: '2025.*'

          - php: 8.2
            symfony: '7.0.*'
            rr: '2024.*'

          - php: 8.2
            symfony: '7.0.*'
            rr: '2025.*'

          - php: 8.3
            symfony: '7.0.*'
            rr: '2024.*'

          - php: 8.3
            symfony: '7.0.*'
            rr: '2025.*'

          - php: 8.4
            symfony: '7.0.*'
            rr: '2024.*'

          - php: 8.4
            symfony: '7.0.*'
            rr: '2025.*'

          - php: 8.2
            symfony: '7.1.*'
            rr: '2024.*'

          - php: 8.2
            symfony: '7.1.*'
            rr: '2025.*'

          - php: 8.3
            symfony: '7.1.*'
            rr: '2024.*'

          - php: 8.3
            symfony: '7.1.*'
            rr: '2025.*'

          - php: 8.4
            symfony: '7.1.*'
            rr: '2024.*'

          - php: 8.4
            symfony: '7.1.*'
            rr: '2025.*'

          - php: 8.2
            symfony: '7.2.*'
            rr: '2024.*'

          - php: 8.2
            symfony: '7.2.*'
            rr: '2025.*'

          - php: 8.3
            symfony: '7.2.*'
            rr: '2024.*'

          - php: 8.3
            symfony: '7.2.*'
            rr: '2025.*'

          - php: 8.4
            symfony: '7.2.*'
            rr: '2024.*'

          - php: 8.4
            symfony: '7.2.*'
            rr: '2025.*'

          - php: 8.2
            symfony: '7.3.*'
            rr: '2024.*'

          - php: 8.2
            symfony: '7.3.*'
            rr: '2025.*'

          - php: 8.3
            symfony: '7.3.*'
            rr: '2024.*'

          - php: 8.3
            symfony: '7.3.*'
            rr: '2025.*'

          - php: 8.4
            symfony: '7.3.*'
            rr: '2024.*'

          - php: 8.4
            symfony: '7.3.*'
            rr: '2025.*'

          - php: 8.4
            symfony: '8.0.*'
            rr: '2025.*'

          - php: 8.5
            symfony: '8.0.*'
            rr: '2025.*'
    steps:
      - uses: actions/checkout@master

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2.37.1
        with:
          php-version: ${{ matrix.php }}
          tools: flex
          extensions: opcache,zip,intl,pcntl,sockets,protobuf,grpc, xdebug

      - name: Download PHP dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        uses: ramsey/composer-install@v1

      - name: Download RoadRunner ${{ matrix.rr }} and Temporal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RR_VERSION: rr:^${{ matrix.rr }}
        run: make get-deps

      - name: Run test suite on PHP ${{ matrix.php }} and Symfony ${{ matrix.symfony }} and RoadRunner ${{ matrix.rr }}
        run: |
          make start-temporal
          make start-rr
          vendor/bin/phpunit --testsuite='Temporal E2E'
          

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: var
          path: var
          retention-days: 2